---
- name: Remove conflicting packages
  apt:
    name: [containerd, runc]
    state: absent

- name: Install Docker.io
  apt:
    name: docker.io
    state: present
    update_cache: yes

- name: Ensure Docker is started and enabled
  service:
    name: docker
    state: started
    enabled: yes

- name: Wait for Docker socket
  wait_for:
    path: /var/run/docker.sock
    state: present